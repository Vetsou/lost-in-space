name: Build project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore LostInSpace.sln

      - name: Check formatting
        run: dotnet format LostInSpace.sln --verify-no-changes --verbosity diagnostic

      - name: Build project
        run: dotnet build LostInSpace.sln --configuration ExportRelease --no-restore

      - name: Run tests
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.6.2'
          dotnet-version: 'net9.0'
          godot-net: true
          version: 'v6.1.3'
          project_dir: './LostInSpace.Tests/'
          paths: 'res://tests'
